# Public routing and chain blueprint; contains no node connection parameters.
mixed-port: 7890
allow-lan: true
mode: rule
unified-delay: true
tcp-concurrent: true
log-level: info
ipv6: true
external-controller: 0.0.0.0:9090
dns:
  enable: true
  respect-rules: true
  enhanced-mode: fake-ip
  follow-rule: true
  ipv6: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    geosite:geolocation-!cn:
      - https://1.1.1.1/dns-query#🚀 节点选择
      - https://8.8.8.8/dns-query#🚀 节点选择
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - router.asus.com
    - localhost.sec.qq.com
    - localhost.ptlogin2.qq.com
    - +.msftconnecttest.com
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - lens.l.google.com
    - '*.n.n.srv.nintendo.net'
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
