rules:
- RULE-SET,applications,🎯 全球直连
- RULE-SET,private,🎯 全球直连
- RULE-SET,lancidr,DIRECT,no-resolve
- GEOIP,LAN,DIRECT,no-resolve
- AND,((NETWORK,UDP),(DST-PORT,443),(GEOSITE,CN)),DIRECT
- RULE-SET,ai,LA-VMRack-三网
- DOMAIN-SUFFIX,linux.do,🚀 节点选择
- DOMAIN-SUFFIX,open.cd,🎯 全球直连
- DOMAIN,clash.razord.top,🎯 全球直连
- DOMAIN,yacd.haishan.me,🎯 全球直连
- DOMAIN,rfc.uhdnow.com,JP-RFCHost
- RULE-SET,TikTok,🎵 TikTok
- RULE-SET,BanAD,🛑 全球拦截
- RULE-SET,BanProgramAD,🍃 应用净化
- RULE-SET,reject,🆎 AdBlock
- RULE-SET,GoogleCN,🎯 全球直连
- RULE-SET,SteamCN,🎮 Steam下载
- RULE-SET,Microsoft,Ⓜ️ 微软服务
- RULE-SET,icloud,🍎 苹果服务
- RULE-SET,apple,🍎 苹果服务
- RULE-SET,ProxyMedia,🌍 国外媒体
- RULE-SET,telegramcidr,📲 电报信息,no-resolve
