# 脱敏分流基准；无节点配置，不能直接导入客户端。
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: 0.0.0.0:9090
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
dns:
  enable: true
  follow-rule: true
  respect-rules: true
  listen: 0.0.0.0:53
  ipv6: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - 223.5.5.5
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://8.8.8.8/dns-query
  - https://1.1.1.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.localdomain'
  - '*.example'
  - '*.invalid'
  - '*.localhost'
  - '*.test'
  - '*.local'
  - '*.home.arpa'
  - router.asus.com
  - localhost.sec.qq.com
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - lens.l.google.com
  - '*.n.n.srv.nintendo.net'
  - +.stun.playstation.net
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  - '*.msftncsi.com'
  - '*.msftconnecttest.com'
  - +.bilibili.com
  - +.bilibili.cn
  - +.hdslb.com
  - +.bilivideo.com
  - +.bilivideo.cn
  - +.acgvideo.com
  - +.biliapi.net
  - +.biliapi.com
  - +.biligame.com
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  endpoint-independent-nat: true
  dns-hijack:
  - any:53
  - tcp://any:53
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
    TLS:
      ports:
      - 443
    QUIC:
      ports:
      - 443
proxies: []
proxy-groups:
- name: 🚀 节点选择
