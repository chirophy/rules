# stash 专用模板；请通过 HTML 转换器填入节点，不要直接导入占位符。
# 分流顺序与固定出口以 rules-baseline.yaml 为准；说明及官方来源见 README.md。
# 适用 iOS/tvOS 3.6+、macOS 4.3+；iOS/tvOS 不支持进程规则。
# 共享代理：Stash iOS/Mac 默认在 7890 提供 HTTP/SOCKS；请在客户端开启「允许局域网连接」。
# 按用户要求显式输出 mixed-port: 7890 / allow-lan: true；客户端实际监听和共享开关仍需确认。
# iOS 减负版：DNS 跟随规则、按 geosite 分流；移除 reject 及其独立广告组，广告覆盖减少。
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: 0.0.0.0:9090
dns:
  follow-rule: true
  ipv6: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    geosite:geolocation-!cn:
      - "https://1.1.1.1/dns-query#🚀 节点选择"
      - "https://8.8.8.8/dns-query#🚀 节点选择"
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - router.asus.com
    - localhost.sec.qq.com
    - localhost.ptlogin2.qq.com
    - +.msftconnecttest.com
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - lens.l.google.com
    - '*.n.n.srv.nintendo.net'
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - +.bilibili.com
    - +.bilibili.cn
    - +.hdslb.com
    - +.bilivideo.com
    - +.bilivideo.cn
    - +.acgvideo.com
    - +.biliapi.net
    - +.biliapi.com
    - +.biligame.com
proxies:
{{proxies}}
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - 🇯🇵 日本-最优
      - 🇭🇰 港澳台-最优
      - 🇺🇸 美国-最优
{{nodeList}}
  - name: ♻️ 自动选择
    type: url-test
    proxies:
{{nodeList}}
    interval: 300
    lazy: true
  - name: 🇯🇵 日本-最优
    type: url-test
    proxies:
{{jpNodeList}}
    interval: 300
    lazy: true
  - name: 🇭🇰 港澳台-最优
    type: url-test
    proxies:
{{hkNodeList}}
    interval: 300
    lazy: true
  - name: 🇺🇸 美国-最优
    type: url-test
    proxies:
{{usNodeList}}
    interval: 300
    lazy: true
  - name: 🤖 AI
    type: select
    proxies:
      - LA-VMRack-三网
      - LA-DMIT
      - LA-Zgo
  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连
{{nodeList}}
  - name: 📲 电报信息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连
{{nodeList}}
  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择
      - 🇯🇵 日本-最优
      - 🇭🇰 港澳台-最优
      - 🇺🇸 美国-最优
  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择
      - 🇯🇵 日本-最优
      - 🇭🇰 港澳台-最优
      - 🇺🇸 美国-最优
  - name: 🎵 TikTok
    type: select
    proxies:
      - 🇺🇸 美国-最优
      - 🇯🇵 日本-最优
      - 🚀 节点选择
{{ttNodeList}}
  - name: 🎮 Steam下载
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择
      - 🇯🇵 日本-最优
      - 🇭🇰 港澳台-最优
      - 🇺🇸 美国-最优
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
  - name: 🛑 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🍃 应用净化
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连
