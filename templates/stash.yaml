  TikTok:
    type: http
    behavior: classical
    format: text
    url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/TikTok/TikTok.list
    interval: 86400
  ai:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/chirophy/ai_rules@main/ai.txt
