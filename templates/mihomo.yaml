# mihomo 专用模板；请通过 HTML 转换器填入节点，不要直接导入占位符。
# 分流顺序与固定出口以 rules-baseline.yaml 为准；说明及官方来源见 README.md。
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: 0.0.0.0:9090
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
dns:
  enable: true
  respect-rules: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    geosite:geolocation-!cn:
      - "https://1.1.1.1/dns-query#🚀 节点选择"
      - "https://8.8.8.8/dns-query#🚀 节点选择"
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - router.asus.com
    - localhost.sec.qq.com
    - localhost.ptlogin2.qq.com
    - +.msftconnecttest.com
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - lens.l.google.com
    - '*.n.n.srv.nintendo.net'
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - +.bilibili.com
    - +.bilibili.cn
    - +.hdslb.com
    - +.bilivideo.com
    - +.bilivideo.cn
    - +.acgvideo.com
    - +.biliapi.net
    - +.biliapi.com
    - +.biligame.com
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  endpoint-independent-nat: true
  dns-hijack:
    - any:53
    - tcp://any:53
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
    TLS:
      ports:
        - 443
    QUIC:
      ports:
        - 443
proxies:
{{proxies}}
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - 🇯🇵 日本-最优
      - 🇭🇰 港澳台-最优
      - 🇺🇸 美国-最优
{{nodeList}}
  - name: ♻️ 自动选择
    type: url-test
    proxies:
{{nodeList}}
    url: http://captive.apple.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 🇯🇵 日本-最优
    type: url-test
    proxies:
{{jpNodeList}}
    url: http://captive.apple.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 🇭🇰 港澳台-最优
    type: url-test
    proxies:
{{hkNodeList}}
    url: http://captive.apple.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 🇺🇸 美国-最优
    type: url-test
    proxies:
{{usNodeList}}
    url: http://captive.apple.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 🤖 AI
    type: select
    proxies:
      - LA-VMRack-三网
      - LA-DMIT
      - LA-Zgo
  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连
{{nodeList}}
  - name: 📲 电报信息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连
{{nodeList}}
  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择
      - 🇯🇵 日本-最优
      - 🇭🇰 港澳台-最优
      - 🇺🇸 美国-最优
  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择
      - 🇯🇵 日本-最优
      - 🇭🇰 港澳台-最优
      - 🇺🇸 美国-最优
  - name: 🎵 TikTok
    type: select
    proxies:
      - 🇺🇸 美国-最优
      - 🇯🇵 日本-最优
      - 🚀 节点选择
{{ttNodeList}}
  - name: 🎮 Steam下载
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择
      - 🇯🇵 日本-最优
      - 🇭🇰 港澳台-最优
      - 🇺🇸 美国-最优
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
  - name: 🛑 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🍃 应用净化
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连
